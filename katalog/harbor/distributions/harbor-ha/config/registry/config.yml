version: 0.1
log:
  level: info
  fields:
    service: registry
storage:
  storage:
    s3:
      region: us-west-1
      bucket: bucketname
      regionendpoint: http://myobjects.local
      secure: true
      skipverify: true
    cache:
      layerinfo: redis
    maintenance:
      uploadpurging:
        enabled: true
        age: 168h
        interval: 24h
        dryrun: false
  delete:
    enabled: true
  redirect:
    disable: false
redis:
  addr: redis+sentinel:redis1:26379,redis2:26379,redis3:26379
  sentinelMasterSet: redisMaster
  db: 2
  password: Replace_me
  readtimeout: 10s
  writetimeout: 10s
  dialtimeout: 10s
  pool:
    maxidle: 100
    maxactive: 500
    idletimeout: 60s
http:
  addr: :5000
  relativeurls: false
  # set via environment variable
  # secret: placeholder
  debug:
    addr: :8001
    prometheus:
      enabled: true
      path: /metrics
auth:
  htpasswd:
    realm: harbor-registry-basic-realm
    path: /etc/registry/passwd
validation:
  disabled: true
compatibility:
  schema1:
    enabled: true