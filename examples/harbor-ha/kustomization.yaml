---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: registry

resources:
  - ../../katalog/harbor/distributions/harbor-ha

configMapGenerator:
  # Core overwritable configuration
  - name: core
    behavior: merge
    files:
      - app.conf=config/core/app.conf
    literals:
      - POSTGRESQL_HOST=%YOUR_DB_HOSTNAME%
      - POSTGRESQL_PORT=%YOUR_DB_PORT%
      - POSTGRESQL_USERNAME=%YOUR_DB_USER%
      - POSTGRESQL_DATABASE=%YOUR_DB_NAME%
      - POSTGRESQL_SSLMODE=disable
      - EXT_ENDPOINT=%YOUR_INGRESS_HOST%
      - _REDIS_URL_CORE="%YOUR_REDIS_SCHEME%://%YOUR_REDIS_PASSWORD%@%YOUR_REDIS_HOSTS%/0?idle_timeout_seconds=30"
      - _REDIS_URL_REG="%YOUR_REDIS_SCHEME%://%YOUR_REDIS_PASSWORD%@%YOUR_REDIS_HOSTS%/2?idle_timeout_seconds=30"

  # Exporter overwritable configuration
  - name: exporter
    behavior: merge
    literals:
      - HARBOR_REDIS_URL=%YOUR_REDIS_SCHEME%://%YOUR_REDIS_PASSWORD%@%YOUR_REDIS_HOSTS%/redisMaster/1
      - HARBOR_REDIS_NAMESPACE=jobservice_ns
      - HARBOR_REDIS_TIMEOUT=3600
      - HARBOR_DATABASE_DBNAME=%YOUR_DB_NAME%
      - HARBOR_DATABASE_HOST=%YOUR_DB_HOSTNAME%
      - HARBOR_DATABASE_MAX_IDLE_CONNS=100
      - HARBOR_DATABASE_MAX_OPEN_CONNS=900
      - HARBOR_DATABASE_PORT=%YOUR_DB_PORT%
      - HARBOR_DATABASE_SSLMODE=disable
      - HARBOR_DATABASE_USERNAME=%YOUR_DB_USER%
    # JobService overwritable configuration
  - name: jobservice
    behavior: merge
    files:
      - config.yml=config/jobservice/config.yml
    # Registry overwritable configuration
  - name: registry
    behavior: merge
    files:
      - config.yml=config/registry/config.yml
      - ctl-config.yml=config/registry/ctl-config.yml

secretGenerator:
  # Core overwritable configuration
  - name: core
    behavior: merge
    literals:
      - secretKey=%CORE_SECURE_KEY%
      - secret=%CORE_SECURE_SECRET%
      - HARBOR_ADMIN_PASSWORD=%HARBOR_ADMIN_PASSWORD%
      - POSTGRESQL_PASSWORD=%YOUR_DB_PASSWORD%
    # JobService overwritable configuration
  - name: jobservice
    behavior: merge
    literals:
      - secret=%JOBSERVICE_SECURE_SECRET%
    # Registry overwritable configuration
  - name: registry
    behavior: merge
    literals:
      - REGISTRY_HTTP_SECRET=%REGISTRY_SECURE_SECRET%
      - REGISTRY_REDIS_PASSWORD="%YOUR_REDIS_PASSWORD%"
      - REGISTRY_STORAGE_S3_ACCESSKEY="%YOUR_OBJECT_STORAGE_ACCESSKEY%"
      - REGISTRY_STORAGE_S3_SECRETKEY="%YOUR_OBJECT_STORAGE_SECRETKEY%"
  - name: trivy
    behavior: merge
    literals:
      - SCANNER_REDIS_URL="%YOUR_REDIS_SCHEME%://:%YOUR_REDIS_PASSWORD%@%YOUR_REDIS_HOSTS%/5?idle_timeout_seconds=30"
      - SCANNER_STORE_REDIS_URL="%YOUR_REDIS_SCHEME%://%YOUR_REDIS_PASSWORD%@%YOUR_REDIS_HOSTS%/5?idle_timeout_seconds=30"
      - SCANNER_JOB_QUEUE_REDIS_URL="%YOUR_REDIS_SCHEME%://%YOUR_REDIS_PASSWORD%@%YOUR_REDIS_HOSTS%/5?idle_timeout_seconds=30"
  - name: exporter
    behavior: merge
    literals:
      - HARBOR_ADMIN_PASSWORD=%HARBOR_ADMIN_PASSWORD%
      - POSTGRESQL_PASSWORD=%YOUR_DB_PASSWORD%

patches:
  - target:
      kind: Deployment|StatefulSet
      name: trivy|core|jobservice|portal|registry
    patch: |
      - op: replace
        path: /spec/replicas
        value: %YOUR_WANTED_REPLICAS%
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: harbor-ingress
    path: patch/ingress.yml
